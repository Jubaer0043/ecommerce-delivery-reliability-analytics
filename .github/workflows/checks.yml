# This workflow is used when this project directory is its own repository root.
name: Project checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_real_data:
        description: 'Download the official public dataset and run all stages'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  software:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Validate notebook schemas
        run: |
          python -c "from pathlib import Path; import nbformat; [nbformat.validate(nbformat.read(p,as_version=4)) for p in Path('notebooks').glob('*.ipynb')]"

  real-data:
    if: github.event_name == 'workflow_dispatch' && inputs.run_real_data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e .
      - run: python -m olist_analytics all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: olist-real-data-evidence
          path: |
            reports/
            notebooks/
