[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-delivery-analytics"
version = "1.0.0"
description = "Reproducible delivery reliability and customer satisfaction analysis"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
olist = "olist_analytics.cli:main"
